name: Backend Tests

on:
  push:
  pull_request:

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://conversation:conversation@localhost:5432/conversation_db
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conversation_db
          POSTGRES_USER: conversation
          POSTGRES_PASSWORD: conversation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conversation -d conversation_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply Alembic migrations
        run: cd backend && alembic upgrade head

      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q
